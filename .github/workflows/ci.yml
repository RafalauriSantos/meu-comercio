name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production App (Turbopack)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
