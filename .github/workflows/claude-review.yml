name: Claude Review

# Reviews each pull request once when it is opened, reopened or marked ready.
# It does not run on every push, to spare the Claude subscription. To review again, close and reopen the PR.
# The review only comments. It never approves, blocks or pushes, so the merge gates in
# docs/PROJECT_WORKFLOW.md stay as they are.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # Skips drafts, forks and Dependabot: none of them can read the secret, and the action refuses bot actors.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Mark the start of the review
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Review the pull request
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Shows what Claude did in the job log, to see why a run ever ends without a comment. The log is public, but
          # Claude only reads this pull request's diff and comments (allowedTools below), which are already public.
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --append-system-prompt "Project rules for this review: money must use the Money value object (integer cents), never number. Every query must be scoped to the tenant (merchant). Business rules live in DECISIONS.md and the code must match them. Changes to money, authentication, permissions or the database schema are high risk: call them out first. Do not comment on formatting or style. Ignore the plugin step that says to stop when Claude, the user or a bot has already commented on the pull request: this job runs on purpose each time the pull request is opened or reopened, so always review the current commits, even when earlier comments exist. At the end, ALWAYS post exactly one pull request comment that starts with '## Code review': say 'No issues found.' when there is nothing to report, or list the findings. Never finish without posting it."

      # The job is green only when Claude left a visible result on the pull request: a summary comment or an inline
      # review comment posted after the review started. Without it the job fails, so a green check means Claude spoke.
      - name: Require a review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          summary=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$REVIEW_STARTED\")] | length" | awk '{s+=$1} END{print s+0}')
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$REVIEW_STARTED\")] | length" | awk '{s+=$1} END{print s+0}')
          echo "summary comments: ${summary:-0}, inline comments: ${inline:-0}"
          if [ "${summary:-0}" -eq 0 ] && [ "${inline:-0}" -eq 0 ]; then
            echo "::error::Claude finished without leaving a comment on the pull request. Close and reopen the pull request to review again."
            exit 1
          fi
