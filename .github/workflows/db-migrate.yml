name: Database Migration

# Applies committed migrations to production. Runs only when started by hand,
# and the `production-db` environment requires the owner's approval before the job starts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations (production)
    runs-on: ubuntu-latest
    environment: production-db
    concurrency:
      group: db-migrate
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
